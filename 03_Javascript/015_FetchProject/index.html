<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Users</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-container input {
            width: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-container input:focus {
            border-color: aquamarine;
        }

        .search-container button {
            padding: 12px 20px;
            background-color: aquamarine;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-container button:hover {
            transform: scale(1.05);
        }

        #root {
            max-width: 1000px;
            margin: 0 auto;
        }

        #root div {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #root img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        #root p {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="search-container">
        <input type="number" placeholder="Enter GitHub User ID">
        <button>Search</button>
    </div>

    <div id="root"></div>

    <script src="./first.js"></script>

</body>
</html>
