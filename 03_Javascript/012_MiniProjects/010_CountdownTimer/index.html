<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympic 2028 Countdown Timer</title>
</head>
<body style="
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1e1e1e;
    font-family:Arial, sans-serif;
">

    <div style="
        text-align:center;
    ">
        <h1 style="
            color:white;
            margin-bottom:20px;
        ">
            Olympic 2028 Countdown Timer
        </h1>

        <div id="container" style="
            color:white;
            font-size:3rem;
            background:#333;
            padding:20px 40px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(255,255,255,0.2);
            
        ">
            700 Days 10 Hrs 12 Min 06 Sec
        </div>
    </div>

    <script>

        setInterval(() => {
             let currTimeStamp = Date.now();
        let olympicTimeStamp = new Date(2028, 6,14).getTime();

        let remTime = olympicTimeStamp-currTimeStamp;

        const days= Math.floor((remTime)/(1000*60*60*24));
        remTime%=1000*60*60*24;

        const hours=Math.floor((remTime)/(1000*60*60));
        remTime%=1000*60*60;

        const minutes=Math.floor((remTime)/(1000*60));
        remTime%=1000*60;

        const seconds=Math.floor((remTime)/(1000));
        remTime%=1000;

        const div = document.getElementById("container");
        div.textContent = `${days} Days ${hours} Hrs ${minutes} Min ${seconds} Sec`
          
        }, 1000);
       
    </script>

</body>
</html>
