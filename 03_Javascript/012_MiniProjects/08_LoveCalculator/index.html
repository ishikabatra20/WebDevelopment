<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
</head>
<body style="margin:0; height:100vh; display:flex; justify-content:center; align-items:center; background:#121212; font-family:Arial,sans-serif;">

    <div style="background:#1e1e1e; padding:30px; border-radius:12px; text-align:center; width:350px; box-shadow:0 0 15px rgba(255,255,255,0.1);">
        
        <h1 style="color:#ff4d6d; margin-bottom:20px;">
            ❤️ Love Calculator ❤️
        </h1>

        <input 
            type="text" 
            placeholder="Your Name"
            style="width:90%; padding:10px; margin-bottom:15px; border:none; border-radius:6px;"
            id="name1"
        >

        <input 
            type="text" 
            placeholder="Partner Name"
            style="width:90%; padding:10px; margin-bottom:20px; border:none; border-radius:6px;"
            id="name2"
        >

        <button
            style="padding:10px 20px; background:#ff4d6d; color:white; border:none; border-radius:6px; cursor:pointer;"
        >
            Calculate Love
        </button>

        <h2 style="color:white; margin-top:20px;">
            Result: ❤️ 
        </h2>

    </div>
    <script src="./index.js"></script>
</body>
</html>
